name: Azion Deploy

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - "main"

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        run: npm ci --legacy-peer-deps

      - name: Debug current version before deploy
        run: |
          echo "Commit atual:"
          git rev-parse HEAD

          echo "Branch/ref:"
          echo "${GITHUB_REF}"
          echo "${GITHUB_SHA}"

          echo "Versão da home:"
          grep -R "Azion RAG Chat" app/page.tsx || true

          echo "Rotas API:"
          find app/api -maxdepth 3 -type f -print

          echo "Conteúdo ingest:"
          cat app/api/ingest/route.ts || true

      - name: Install Azion CLI
        run: |
          curl -o azionlinux https://downloads.azion.com/linux/x86_64/azion
          sudo mv azionlinux /usr/bin/azion
          sudo chmod u+x /usr/bin/azion

      - name: Azion Deploy
        run: |
          azion -t ${{ secrets.AZION_PERSONAL_TOKEN }}
          azion deploy --local --debug --auto --yes